[GNSS-SDR]

; ---------------------------------------------------------------------------
; GPS L1 C/A -> position, from ONE B210 channel with an external RF front end.
;
;   serial 34D04E6, channel 1 = RF B (subdevice A:B), antenna RX2, via the RFFE
;
; This is the live/continuous path. The deterministic path is
;   ./gpsfix.py --run --seconds 120
; which records to a file first, tells you whether satellites are present at
; all, and only then runs gnss-sdr. Prefer that during bring-up: when this
; config produces nothing it cannot tell you why, and a recording can be
; re-processed with different settings instead of re-flying the experiment.
;
;   gnss-sdr --config_file=usrp_gps_l1_ch1.conf
;   fix appears on the console and in /tmp/usrp_gps_ch1/gnss_sdr_pvt.nmea
;
; --------------------------------------------------------------------------
; THE ANTENNA PORT IS NOT SET HERE, AND CANNOT BE.
;
; gnss-sdr's UHD_Signal_Source has no antenna property: in
; uhd_signal_source.cc the set_antenna() call is commented out and no
; configuration key is read for it. A `SignalSource.antenna=RX2` line -- which
; usrp_gps_l1.conf carried -- is silently ignored. It is omitted here rather
; than left in place looking effective.
;
; This works anyway because UHD's B200/B210 driver initialises every RX
; frontend to "RX2" (b200_impl.cpp sets it during setup_radio), so a fresh
; process lands on RX2 by default. That is a default, not a request. If the
; port ever matters more than that, record with gpsfix.py --record, which calls
; set_rx_antenna() explicitly and fails loudly if the port is unavailable.
; --------------------------------------------------------------------------
;
; SUBDEVICE A:B IS CHANNEL 1. A:A is channel 0. usrp_gps_l1.conf uses A:A --
; that is the other channel, and pointing it at an antenna wired to channel 1
; yields a clean capture of nothing.
; ---------------------------------------------------------------------------

; 4 MSPS, matching gpsacq.cpp (SAMPLE_RATE = 4e6) and gpsfix.py, so a result
; from any of the three can be compared against the others. Note the older
; usrp_gps_l1.conf claims 4096000 "matches gpsacq" -- it does not.
GNSS-SDR.internal_fs_sps=4000000

SignalSource.implementation=UHD_Signal_Source
SignalSource.item_type=gr_complex
SignalSource.device_address=serial=34D04E6
SignalSource.subdevice=A:B
SignalSource.RF_channels=1
SignalSource.sampling_frequency=4000000
SignalSource.freq=1575420000
SignalSource.IF_bandwidth_hz=4000000

; 40 dB assumes the RFFE supplies its own LNA (~25-30 dB), matching gpsacq.cpp's
; RX_GAIN = 40. The gain=70 in usrp_gps_l1.conf was for BARE PASSIVE PATCHES;
; with an amplified front end it drives the B210 into compression, which
; presents as "no satellites" rather than as an obvious overload.
; Confirm the level empirically:  ./gpsfix.py --gain-sweep 20,30,40,50,60
SignalSource.gain=40

SignalSource.samples=0
SignalSource.repeat=false
SignalSource.dump=false
SignalSource.enable_throttle_control=false

; The B210's TCXO is +/-2 ppm, which at L1 is +/-3.15 kHz of apparent Doppler --
; covered by the +/-10 kHz search below. Switch both to external once the GPSDO
; holds lock: a disciplined reference narrows the search and steadies tracking.
SignalSource.clock_source=internal
SignalSource.time_source=internal

SignalConditioner.implementation=Signal_Conditioner
DataTypeAdapter.implementation=Pass_Through
InputFilter.implementation=Pass_Through
Resampler.implementation=Pass_Through

Channels_1C.count=10
Channels.in_acquisition=2
Channel.signal=1C

Acquisition_1C.implementation=GPS_L1_CA_PCPS_Acquisition
Acquisition_1C.item_type=gr_complex
Acquisition_1C.pfa=0.01
Acquisition_1C.doppler_max=10000
Acquisition_1C.doppler_step=250
; 4 ms stays clear of the 20 ms navigation bit boundary. Raising this is the
; main lever for a weak signal, but see gpsfix.py acquire() -- it only pays off
; if the dwell count stays up, and above ~10 ms the nav bits cancel the sum.
Acquisition_1C.coherent_integration_time_ms=4
Acquisition_1C.max_dwells=3
Acquisition_1C.blocking=true

Tracking_1C.implementation=GPS_L1_CA_DLL_PLL_Tracking
Tracking_1C.item_type=gr_complex
; A static antenna has no dynamics to track, so narrow loops are strictly
; better here -- they admit less noise. Narrowing further (pll 15 / dll 1.0) is
; the first thing to try when locks cycle, which is the failure this project
; recorded on the passive patches.
Tracking_1C.pll_bw_hz=25.0
Tracking_1C.dll_bw_hz=1.5
Tracking_1C.early_late_space_chips=0.5
Tracking_1C.dump=false

TelemetryDecoder_1C.implementation=GPS_L1_CA_Telemetry_Decoder
Observables.implementation=Hybrid_Observables

PVT.implementation=RTKLIB_PVT
PVT.positioning_mode=Single
PVT.output_rate_ms=1000
PVT.display_rate_ms=1000
PVT.elevation_mask=5
PVT.nmea_rate_ms=1000
PVT.nmea_output_file_enabled=true
PVT.nmea_dump_filename=gnss_sdr_pvt.nmea
PVT.nmea_output_file_path=/tmp/usrp_gps_ch1
PVT.kml_output_enabled=true
PVT.gpx_output_enabled=true
PVT.output_path=/tmp/usrp_gps_ch1
